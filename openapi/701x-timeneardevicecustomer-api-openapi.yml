openapi: 3.2.0
info:
  title: 701x API V1 Time Near Device Customer API
  description: 701x API
  version: v1
tags:
- name: TimeNearDeviceCustomer
paths:
  /TimeNearDeviceCustomer/GetAllByDataFilter:
    get:
      tags:
      - TimeNearDeviceCustomer
      parameters:
      - name: CompanyId
        in: query
        schema:
          type: string
          format: uuid
      - name: AnimalId
        in: query
        schema:
          type: string
          format: uuid
      - name: ScanningTagId
        in: query
        schema:
          type: string
          format: uuid
      - name: FoundTagId
        in: query
        schema:
          type: string
          format: uuid
      - name: StartTime
        in: query
        schema:
          type: string
          format: date-time
      - name: EndTime
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeNearDeviceImport'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeNearDeviceImport'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeNearDeviceImport'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - API701x
      summary: Get time near device customer get all by data filter
      x-summary-source: derived
      operationId: getTimeNearDeviceCustomerGetAllByDataFilter
      x-operation-id-source: derived
  /TimeNearDeviceCustomer/{id}:
    get:
      tags:
      - TimeNearDeviceCustomer
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TimeNearDeviceImport'
            application/json:
              schema:
                $ref: '#/components/schemas/TimeNearDeviceImport'
            text/json:
              schema:
                $ref: '#/components/schemas/TimeNearDeviceImport'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - API701x
      summary: Get time near device customer by id
      x-summary-source: derived
      operationId: getTimeNearDeviceCustomerById
      x-operation-id-source: derived
components:
  schemas:
    TimeNearDeviceImport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tagId:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        devicesNearby:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DevicePresence'
      additionalProperties: false
    DevicePresence:
      type: object
      properties:
        timeRecorded:
          type: integer
          format: int64
        animalId:
          type:
          - string
          - 'null'
          format: uuid
        companyId:
          type:
          - string
          - 'null'
          format: uuid
        tagId:
          type:
          - string
          - 'null'
          format: uuid
        macAddress:
          type:
          - string
          - 'null'
        arrivalTime:
          type: integer
          format: int64
        departureTime:
          type: integer
          format: int64
        timeNearDevice_SEC:
          type: integer
          format: int64
      additionalProperties: false
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.701x.com/connect/authorize
          tokenUrl: https://login.701x.com/connect/token
          scopes:
            api1: Demo API - full access

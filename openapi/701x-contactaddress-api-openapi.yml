openapi: 3.2.0
info:
  title: 701x API V1 Contact Address API
  description: 701x API
  version: v1
tags:
- name: ContactAddress
paths:
  /ContactAddress/ContactAddressByFilter:
    get:
      tags:
      - ContactAddress
      parameters:
      - name: CompanyId
        in: query
        schema:
          type: string
          format: uuid
      - name: ContactId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact_Address'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact_Address'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact_Address'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - API701x
      summary: Get contact address contact address by filter
      x-summary-source: derived
      operationId: getContactAddressContactAddressByFilter
      x-operation-id-source: derived
  /ContactAddress/{id}:
    get:
      tags:
      - ContactAddress
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DB_Contact_Address'
            application/json:
              schema:
                $ref: '#/components/schemas/DB_Contact_Address'
            text/json:
              schema:
                $ref: '#/components/schemas/DB_Contact_Address'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - API701x
      summary: Get contact address by id
      x-summary-source: derived
      operationId: getContactAddressById
      x-operation-id-source: derived
  /ContactAddress/MassUpdate:
    post:
      tags:
      - ContactAddress
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type:
              - array
              - 'null'
              items:
                $ref: '#/components/schemas/Contact_Address'
          application/json:
            schema:
              type:
              - array
              - 'null'
              items:
                $ref: '#/components/schemas/Contact_Address'
          text/json:
            schema:
              type:
              - array
              - 'null'
              items:
                $ref: '#/components/schemas/Contact_Address'
          application/*+json:
            schema:
              type:
              - array
              - 'null'
              items:
                $ref: '#/components/schemas/Contact_Address'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact_Address'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact_Address'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact_Address'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - API701x
      summary: Create contact address mass update
      x-summary-source: derived
      operationId: postContactAddressMassUpdate
      x-operation-id-source: derived

components:
  schemas:
    Service_Subscription_Billing_Event:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        subscriptionId:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
        paidDate:
          type:
          - string
          - 'null'
          format: date-time
        eventDate:
          type: string
          format: date-time
        data:
          $ref: '#/components/schemas/Billing_Event_Data'
      additionalProperties: false
    Service_Subscription:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        renewalDate:
          type: string
          format: date-time
        currencyCode:
          type:
          - string
          - 'null'
        customerStripeId:
          type:
          - string
          - 'null'
        companyId:
          type: string
          format: uuid
        cost:
          type:
          - number
          - 'null'
          format: double
        renewalType:
          type:
          - string
          - 'null'
        shipCity:
          type:
          - string
          - 'null'
        shipState:
          type:
          - string
          - 'null'
        shipZip:
          type:
          - string
          - 'null'
        shipCountry:
          type:
          - string
          - 'null'
        shipAddress1:
          type:
          - string
          - 'null'
        shipAddress2:
          type:
          - string
          - 'null'
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
        canceledDate:
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
    Sub_Line_Item_Cancel_Body:
      type: object
      properties:
        lineItemIds:
          type:
          - array
          - 'null'
          items:
            type: string
        companyId:
          type: string
          format: uuid
      additionalProperties: false
    Billing_Event_Data:
      type: object
      properties:
        total:
          type:
          - number
          - 'null'
          format: float
        tax:
          type:
          - number
          - 'null'
          format: float
        shipInfo:
          $ref: '#/components/schemas/Billing_Event_Ship_Info'
        lineItems:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Billing_Event_Line_Item'
      additionalProperties: false
    Billing_Event_Line_Item:
      type: object
      properties:
        deviceId:
          type: string
          format: uuid
        priceAmount:
          type: number
          format: float
      additionalProperties: false
    Billing_Event_Ship_Info:
      type: object
      properties:
        shipAddress1:
          type:
          - string
          - 'null'
        shipAddress2:
          type:
          - string
          - 'null'
        shipCity:
          type:
          - string
          - 'null'
        shipState:
          type:
          - string
          - 'null'
        shipCountry:
          type:
          - string
          - 'null'
        shipZip:
          type:
          - string
          - 'null'
      additionalProperties: false
    Service_Subscription_Line_Item:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        subscriptionId:
          type:
          - string
          - 'null'
        subscriptionTierId:
          type:
          - string
          - 'null'
        currentPriceId:
          type:
          - string
          - 'null'
        nextPriceId:
          type:
          - string
          - 'null'
        deviceId:
          type: string
          format: uuid
        price:
          type: number
          format: float
        tierName:
          type:
          - string
          - 'null'
        inWarranty:
          type:
          - boolean
          - 'null'
        reactivatePending:
          type:
          - boolean
          - 'null'
        decommissionSuccess:
          type:
          - boolean
          - 'null'
        transferredAt:
          type:
          - string
          - 'null'
          format: date-time
        activationDate:
          type: string
          format: date-time
        cancellationDate:
          type:
          - string
          - 'null'
          format: date-time
        decommissionDate:
          type:
          - string
          - 'null'
          format: date-time
        lastRenewedDate:
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.701x.com/connect/authorize
          tokenUrl: https://login.701x.com/connect/token
          scopes:
            api1: Demo API - full access

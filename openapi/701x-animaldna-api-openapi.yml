openapi: 3.2.0
info:
  title: 701x API V1 Animal DNA API
  description: 701x API
  version: v1
tags:
- name: AnimalDNA
paths:
  /AnimalDNA/AnimalDNADataByFilter:
    get:
      tags:
      - AnimalDNA
      parameters:
      - name: top
        in: query
        schema:
          type:
          - integer
          - 'null'
          format: int32
      - name: orderBy
        in: query
        schema:
          type:
          - string
          - 'null'
      - name: offset
        in: query
        schema:
          type:
          - integer
          - 'null'
          format: int32
      - name: fetch
        in: query
        schema:
          type:
          - integer
          - 'null'
          format: int32
      - name: CompanyId
        in: query
        schema:
          type: string
          format: uuid
      - name: AnimalId
        in: query
        schema:
          type:
          - string
          - 'null'
          format: uuid
      - name: isShared
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Animal_DNA'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Animal_DNA'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Animal_DNA'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - API701x
      summary: Get animal dna animal dna data by filter
      x-summary-source: derived
      operationId: getAnimalDNAAnimalDNADataByFilter
      x-operation-id-source: derived
  /AnimalDNA/{id}:
    get:
      tags:
      - AnimalDNA
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Animal_DNA'
            application/json:
              schema:
                $ref: '#/components/schemas/Animal_DNA'
            text/json:
              schema:
                $ref: '#/components/schemas/Animal_DNA'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - API701x
      summary: Get animal dna by id
      x-summary-source: derived
      operationId: getAnimalDNAById
      x-operation-id-source: derived
  /AnimalDNA/MassUpdate:
    post:
      tags:
      - AnimalDNA
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type:
              - array
              - 'null'
              items:
                $ref: '#/components/schemas/Animal_DNA'
          application/json:
            schema:
              type:
              - array
              - 'null'
              items:
                $ref: '#/components/schemas/Animal_DNA'
          text/json:
            schema:
              type:
              - array
              - 'null'
              items:
                $ref: '#/components/schemas/Animal_DNA'
          application/*+json:
            schema:
              type:
              - array
              - 'null'
              items:
                $ref: '#/components/schemas/Animal_DNA'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Animal_DNA'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Animal_DNA'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Animal_DNA'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - API701x
      summary: Create animal dna mass update
      x-summary-source: derived
      operationId: postAnimalDNAMassUpdate
      x-operation-id-source: derived
  /AnimalDNA/IngestBreedComposition:
    post:
      tags:
      - AnimalDNA
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type:
              - array
              - 'null'
              items:
                $ref: '#/components/schemas/BreedCompositionIngestItem'
          application/json:
            schema:
              type:
              - array
              - 'null'
              items:
                $ref: '#/components/schemas/BreedCompositionIngestItem'
          text/json:
            schema:
              type:
              - array
              - 'null'
              items:
                $ref: '#/components/schemas/BreedCompositionIngestItem'
          application/*+json:
            schema:
              type:
              - array
              - 'null'
              items:
                $ref: '#/components/schemas/BreedCompositionIngestItem'
      responses:
        '200':
          description: Success
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - API701x
      summary: Create animal dna ingest breed composition
      x-summary-source: derived
      operationId: postAnimalDNAIngestBreedComposition
      x-operation-id-source: derived
components:
  schemas:
    BreedComp:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        pct:
          type: number
          format: double
      additionalProperties: false
    BreedCompositionIngestItem:
      type: object
      properties:
        animalId:
          type:
          - string
          - 'null'
        sampleNumber:
          type:
          - string
          - 'null'
        breeds:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/BreedComp'
      additionalProperties: false
    Animal_DNA:
      type: object
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        farmId:
          type: string
          format: uuid
        animalId:
          type: string
          format: uuid
        sampleNumber:
          type:
          - string
          - 'null'
        sampleType:
          type:
          - string
          - 'null'
        collectionDate:
          type: string
          format: date-time
        breedComposition:
          type:
          - string
          - 'null'
        breedCompositionSource:
          type:
          - string
          - 'null'
        createdByUserId:
          type:
          - string
          - 'null'
          format: uuid
        createdByDate:
          type:
          - string
          - 'null'
          format: date-time
        lastUpdatedByUserId:
          type:
          - string
          - 'null'
          format: uuid
        lastUpdatedByDate:
          type:
          - string
          - 'null'
          format: date-time
        inActiveDate:
          type:
          - string
          - 'null'
          format: date-time
        lastSyncEpoch:
          type:
          - integer
          - 'null'
          format: int64
        deleteSyncEpoch:
          type:
          - integer
          - 'null'
          format: int64
        isShared:
          type:
          - boolean
          - 'null'
        isNew:
          type: boolean
        isUpdate:
          type: boolean
        isDelete:
          type: boolean
        error:
          type:
          - string
          - 'null'
      additionalProperties: false
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.701x.com/connect/authorize
          tokenUrl: https://login.701x.com/connect/token
          scopes:
            api1: Demo API - full access

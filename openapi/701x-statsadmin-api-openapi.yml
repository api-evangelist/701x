components:
  schemas:
    Stats_Line_Response:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        overallSummery:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Stats_Point'
        sum:
          type:
          - number
          - 'null'
          format: double
        sumUnit:
          type:
          - string
          - 'null'
        sumName:
          type:
          - string
          - 'null'
        avg:
          type:
          - number
          - 'null'
          format: double
        avgUnit:
          type:
          - string
          - 'null'
        avgName:
          type:
          - string
          - 'null'
        overallSum:
          type:
          - number
          - 'null'
          format: double
        overallAvg:
          type:
          - number
          - 'null'
          format: double
        overallSumName:
          type:
          - string
          - 'null'
        overallSumUnit:
          type:
          - string
          - 'null'
        overallAvgName:
          type:
          - string
          - 'null'
        overallAvgUnit:
          type:
          - string
          - 'null'
        summery:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Stats_Point'
        timeSeries:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Stats_Time_Point'
      additionalProperties: false
    Stats_Point:
      type: object
      properties:
        category:
          type:
          - string
          - 'null'
        value:
          type: number
          format: double
      additionalProperties: false
    Stats_Response:
      type: object
      properties:
        stats:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Stats_Line_Response'
      additionalProperties: false
    Stats_Time_Point:
      type: object
      properties:
        date:
          type: string
          format: date-time
        category:
          type:
          - string
          - 'null'
        value:
          type: number
          format: double
      additionalProperties: false
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.701x.com/connect/authorize
          tokenUrl: https://login.701x.com/connect/token
          scopes:
            api1: Demo API - full access

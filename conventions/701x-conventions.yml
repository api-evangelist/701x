summary: >-
  Cross-cutting runtime semantics for the 701x API V1, derived from the published OpenAPI 3.0.1
  contract and the company's OpenID Connect discovery document. The spec is a Swashbuckle
  auto-generation off an ASP.NET Core controller surface: it is complete on shape (paths,
  parameters, schemas) and empty on prose (no operation summaries or descriptions, and only 7 of
  1,391 operations carry an operationId), so several conventions below are read from the shape of
  the surface rather than from documentation the provider has published.
authentication:
  style: oauth2
  flow: authorization_code
  authorization_url: https://login.701x.com/connect/authorize
  token_url: https://login.701x.com/connect/token
  issuer: https://login.701x.com
  required_scope: API701x
  applied_to: >-
    1158 of 1391 operations declare the oauth2 security requirement with scope API701x;
    234 declare no security requirement in the contract.
  detail: authentication/701x-authentication.yml
idempotency:
  coverage: none
  mechanism: none
  header: null
  scope: []
  evidence: >-
    No Idempotency-Key (or equivalent) header parameter appears anywhere in the 1,391 operations —
    the spec declares no header parameters at all. The single occurrence of the string
    "idempotencyKey" is a readOnly response field on the StripeResponse schema, i.e. Stripe's own
    key echoed back on checkout responses, not a client-supplied replay guard on 701x writes.
  consequence: >-
    899 mutating operations (567 POST, 183 PUT, 149 DELETE, 1 PATCH), including MassInsert /
    MassUpdate / MassDelete bulk endpoints, have no documented replay protection. A retried bulk
    animal insert after a timeout is not safe.
reversibility:
  grade: documented
  credit: 0.4
  rationale: >-
    Reversal operations exist for two write surfaces and are visible in the contract, but 701x
    publishes no developer documentation, so no reversal WINDOW is stated anywhere. Nothing here
    asserts a time limit, because none was found.
  surfaces:
  - surface: Service subscriptions
    write: POST /ServiceSubscription, PUT /ServiceSubscription/{id}
    reversal: POST /ServiceSubscription/Cancel/{id}, POST /ServiceSubscription/CancelSubscriptionLineItems
    re_enable: POST /ServiceSubscription/Resume/{id}, POST /ServiceSubscription/ResumeSubscriptionLineItems
    operation_id: null
    window: null
    window_source: null
  - surface: Company share (herd data sharing invitations)
    write: POST /CompanyShare
    reversal: POST /CompanyShare/Cancel/{id}
    operation_id: null
    window: null
    window_source: null
  - surface: Animal, tag, farm, medication and all other records
    write: POST / PUT / MassInsert / MassUpdate
    reversal: none
    note: >-
      DELETE and MassDelete exist on most resources; no Restore, Undo, Unarchive or Reverse
      operation is published for any of them. A few schemas carry an isArchived flag, which
      suggests soft deletion internally, but no restore endpoint is exposed.
  - surface: Stripe checkout
    write: POST /Stripe/ProcessCheckOut
    reversal: none exposed
    note: Refunds are handled in Stripe, not through a published 701x operation.

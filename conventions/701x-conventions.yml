  - GET /AnimalLogControllerAdmin/GetAllSSE
  - GET /Company/GetAllSSE
  - GET /Company/GetAllChangesSSE
  - GET /Company/FullPullSSE
  - GET /LogMaster/GetAllSSE
  - GET /LogMasterControllerAdmin/GetAllSSE
  note: >-
    Seven operations are named *SSE and take a companyId query parameter, which is the shape of a

apis:
- name: 701x API V1
  description: >-
    First-party REST API behind the 701x Autonomous Rancher platform and mobile apps. Publicly
    readable OpenAPI 3.0.1 contract served from a live Swagger UI at the API host root, covering
    animal records (birth, wean, year, carcass, ultrasound, DNA, EPD, calving, check-in, turn-out),
    herd groups and locations, farms, pastures, points of interest and virtual fences, smart-tag
    inventory and telemetry ingest, companies, users, sharing and transfers, medications and
    treatments, carts, orders, Stripe-backed checkout and service subscriptions. Secured with
    OAuth 2.0 / OpenID Connect against login.701x.com.

aid: 701x
name: 701x
description: >-
  701x, Inc. is a Fargo, North Dakota agricultural technology company building an end-to-end
  technology stack for beef cattle producers: solar-powered GPS smart ear tags (xTpro), wireless
  Bluetooth smart tags (xTlite), base stations and water sensors, paired with the Autonomous
  Rancher herd-management software and mobile apps. The platform keeps a digital calving book,
  animal inventory, interactive pasture map, health and activity alerts, virtual fencing, DNA and
  EPD records, medication and treatment logs, and two-way registration/performance sync with beef
  breed associations (DigitalBeef). 701x operates a first-party REST API at api.701x.com — a live,
  publicly readable Swagger/OpenAPI 3.0.1 contract with roughly 1,391 operations across animals,
  tags, farms, companies, carts, subscriptions and telemetry — secured by its own OpenID Connect
  identity server at login.701x.com.

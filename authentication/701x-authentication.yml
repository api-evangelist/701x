findings:
- >-
  The scope the API actually enforces (API701x) is NOT in the authorization server's
  scopes_supported list, and the scope the securityScheme documents (api1, described as
  "Demo API - full access") is not the one any operation requires. A client following the
  published contract literally would request the wrong scope.
- >-
  The authorization server advertises the implicit and resource-owner-password grants, both
  discouraged by OAuth 2.0 Security Best Current Practice (RFC 9700).
- >-
  PKCE is supported, but "plain" is offered alongside S256; S256 should be preferred by clients.
- No API-key, HTTP basic or mutual-TLS authentication path exists on this API.

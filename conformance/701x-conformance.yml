  Connect discovery document. 701x conforms to OAuth 2.0 and OpenID Connect Discovery through a
  self-hosted IdentityServer. It does not conform to RFC 9457, and the beef-cattle market's own
  interchange standards are absent from the contract even though the product integrates with breed
  associations.

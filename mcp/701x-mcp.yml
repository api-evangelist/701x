tools:
- name: GetBusinessDetails
  description: Retrieves business and site details such as timezone, email, phone, and address.
  inputs: []
- name: SearchInSite
  description: Searches the public 701x website for information.
  inputs: [searchTerm]
- name: SearchSiteApiDocs
  description: Retrieves API documentation for the Wix business solutions installed on this site.
  inputs: [searchTerm]
- name: GenerateVisitorToken
  description: Creates a visitor session and returns a visitor access token for the site.
  inputs: []
- name: CallWixSiteAPI
  description: Calls Wix site API methods on a visitor's behalf (query site data, start a purchase).
  inputs: [visitorToken, url, method, body]
- name: ExecuteWixAPI
  description: Executes Wix API code against the site.
  inputs: [code, reason, hasMutations, sourceDocUrls, visitorToken]
- name: ReadFullDocsArticle
  description: Fetches a complete article from the Wix developer documentation portal.
  inputs: [articleUrl]
- name: ReadFullDocsMethodSchema
  description: Fetches the full schema for a Wix API method.
  inputs: [articleUrl, reason]
- name: BrowseWixRESTDocsMenu
  description: Browses the Wix REST documentation menu.
  inputs: [menuUrl, reason]
notes:
- >-
  No first-party 701x MCP server was found. Probes for a hosted server on api.701x.com,
  app.701x.com, mobile.701x.com and marketplace.701x.com returned 404 or an SPA shell, and no
  npm/PyPI package publishing a 701x MCP server exists in any registry searched.
- >-
  The advertised endpoint is unauthenticated and, per the Wix llms.txt, exposes only public site
  information. Agents should not expect access to herd, animal or tag data through it.

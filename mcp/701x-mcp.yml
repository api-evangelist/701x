name: 701x Site MCP (Wix-provided)
summary: >-
  701x serves a live, anonymous MCP endpoint at https://www.701x.com/_api/mcp, advertised in its
  own /llms.txt. It is the standard Wix Site MCP shipped with the Wix-hosted marketing site — the
  tool set is Wix's, not 701x's, and every tool operates on public website content or on the Wix
  platform APIs. NONE of the nine tools reaches the 701x cattle platform: there is no MCP tool for
  animals, herds, tags, farms, telemetry or any other operation in the 701x API V1 OpenAPI. Recorded
  here because it is a real, reachable agent surface on a 701x host — not because 701x authored it.
authorship: platform
